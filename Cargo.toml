[workspace]
members = ["src-tauri"]
resolver = "3"

# Single source of truth for the application version. Bump this one line per release;
# both crates inherit it via `version.workspace = true`, and Tauri reads the resolved
# `arx-runa-tauri` version (tauri.conf.json intentionally omits `version`).
[workspace.package]
version = "0.1.6"

[package]
name = "arx-runa"
version.workspace = true
edition = "2024"
authors = ["Chrizzio AKA Christian Salgård Svinding"]

[lib]
name = "arx_runa"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "arx-runa"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
leptos_router = "0.8"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
zeroize = { version = "1", features = ["alloc", "derive"] }
web-sys = { version = "0.3", features = ["Window", "HtmlInputElement", "Event", "DragEvent", "DataTransfer", "FileList", "File", "History"] }
js-sys = "0.3"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
