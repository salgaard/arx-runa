name: CI

on:
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]
    #        platform: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Rust CI environment
        uses: ./.github/actions/setup-rust-ci
        with:
          components: clippy, rustfmt

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Prepend Strawberry Perl to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Mirrors the local lint command and the test step so both share artifacts.
      - name: Run Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Release build
        run: cargo build -p arx-runa-tauri --release

  e2e:
    name: e2e (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]
    #        platform: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Rust CI environment
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            xvfb \
            webkit2gtk-driver

      - name: Update WebView2 runtime to match runner's msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner ships msedgedriver pre-installed (matching its Edge version).
          # WebView2 runtime can lag one release behind, causing a version mismatch.
          # Updating WebView2 via the official bootstrapper brings it in sync.
          $bootstrapper = "$env:RUNNER_TEMP\WebView2RuntimeInstaller.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          Start-Process -FilePath $bootstrapper -ArgumentList "/silent /install" -Wait
          Write-Host "WebView2 updated. Using pre-installed msedgedriver from PATH."

      - name: Configure Strawberry Perl for OpenSSL build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@aaa84a43aec4955a42c5ffc65d258961e39f276e # v1.19.1

      - name: Install Trunk, tauri-cli and tauri-driver (prebuilt)
        # binstall fetches prebuilt release binaries instead of compiling from
        # source; it falls back to `cargo install` if no prebuilt exists.
        run: cargo binstall -y --locked trunk tauri-cli tauri-driver

      - name: Set up Node with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/tests/e2e/package-lock.json

      - name: Install root npm dependencies (Tailwind CSS)
        run: npm ci

      - name: Install e2e npm dependencies
        run: npm ci
        working-directory: src-tauri/tests/e2e

      - name: Run e2e tests
        # npm test builds the app via `cargo tauri build --no-bundle` (onPrepare hook)
        # before launching tauri-driver. E2E_RELEASE=1 selects the release profile.
        # Linux needs a virtual framebuffer; macOS and Windows have a native display.
        shell: bash
        working-directory: src-tauri/tests/e2e
        env:
          E2E_RELEASE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm test
          else
            npm test
          fi
