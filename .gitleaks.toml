title = "arx-runa gitleaks config"

[extend]
# Keep the full upstream default ruleset. New Gitleaks rule additions are
# automatically included without manual maintenance of this file.
useDefault = true

[allowlist]
description = "Suppress crypto-codebase false positives"

regexes = [
  # Rust byte-array test vectors: [0xAAu8; 32] — deterministic fixtures, not real secrets
  '''0x[0-9A-Fa-f]{2}u8''',
  # Zero-fill initialisation: [0u8; 32]
  '''0u8;\s*\d+''',
  # HKDF info strings: b"arx-runa-..." — plain ASCII byte-string constants, no entropy
  '''b"arx-runa-[a-z\-]+"''',
]

stopwords = [
  # AWS documentation canonical placeholder key — not a real credential
  "AKIAIOSFODNN7EXAMPLE",
  # AEAD cipher names in documentation — not API keys
  "XChaCha20-Poly1305",
]

paths = [
  '''Cargo\.lock''',                            # package checksums (SHA hashes, not credentials)
  '''src-tauri/permissions/autogenerated/.*''', # auto-generated Tauri permission stubs
  '''\.github/workflows/.*''',                  # uses ${{ secrets.X }} expressions, never literal values
]

# Rules intentionally NOT suppressed (must always fire):
#   private-key            — PEM blocks (-----BEGIN * PRIVATE KEY-----)
#   github-pat             — GitHub tokens (ghp_*, ghu_*)
#   github-fine-grained-pat — github_pat_* tokens
#   aws-access-token       — AKIA* key IDs
#   aws-secret-key         — AWS secret access key format
#   generic-api-key        — high-entropy assignments (suppress per-line with // gitleaks:allow if truly a false positive)
#
# For any individual line that still false-positives after the global allowlist,
# append `// gitleaks:allow` on that line — the canonical per-line suppression mechanism.
