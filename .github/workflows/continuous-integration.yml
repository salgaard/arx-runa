name: CI

on:
  push:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Prepare CI rclone sidecar stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            touch src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            touch src-tauri/bin/rclone-aarch64-apple-darwin
            touch src-tauri/bin/rclone-x86_64-apple-darwin
            chmod +x src-tauri/bin/rclone-aarch64-apple-darwin src-tauri/bin/rclone-x86_64-apple-darwin
          fi

      - name: Run Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Release build
        run: cargo build --workspace --release

  e2e:
    name: e2e (Zero-Trace frontend)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            xvfb \
            webkit2gtk-driver

      - name: Prepare CI rclone sidecar stub
        run: |
          mkdir -p src-tauri/bin
          touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu

      - name: Install Trunk (WASM bundler)
        run: cargo install trunk --locked

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install root npm dependencies (Tailwind CSS)
        run: npm install

      - name: Install e2e npm dependencies
        run: npm install
        working-directory: src-tauri/tests/e2e

      - name: Run e2e tests
        # npm test builds the app via `cargo tauri build --no-bundle` (onPrepare hook)
        # before launching tauri-driver. E2E_RELEASE=1 selects the release profile.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm test
        working-directory: src-tauri/tests/e2e
        env:
          E2E_RELEASE: "1"
