name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RCLONE_VERSION: v1.73.5

jobs:
  release:
    name: Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            rust_targets: wasm32-unknown-unknown
            args: ''
          - platform: windows-latest
            rust_targets: wasm32-unknown-unknown
            args: ''
          - platform: macos-latest
            rust_targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install zstd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.5.6"
          $url = "https://github.com/facebook/zstd/releases/download/v${version}/zstd-v${version}-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile zstd.zip
          Expand-Archive -Path zstd.zip -DestinationPath zstd-bin
          $dir = (Get-ChildItem zstd-bin -Directory | Select-Object -First 1).FullName
          echo $dir >> $env:GITHUB_PATH

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Trunk (WASM bundler)
        uses: jetli/trunk-action@69821d4eec12c308c4b811e459e37556cf920057 # v0.5.0

      - name: Install Node (Tailwind CSS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Cache rclone sidecar
        id: rclone-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/bin
          key: rclone-${{ runner.os }}-${{ env.RCLONE_VERSION }}

      - name: Download rclone sidecar
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-linux-amd64.zip" -o rclone.zip
            unzip -j rclone.zip "*/rclone" -d src-tauri/bin
            mv src-tauri/bin/rclone src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-windows-amd64.zip" -o rclone.zip
            unzip -j rclone.zip "*/rclone.exe" -d src-tauri/bin
            mv src-tauri/bin/rclone.exe "src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-osx-arm64.zip" -o rclone-arm.zip
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-osx-amd64.zip" -o rclone-amd.zip
            unzip -j rclone-arm.zip "*/rclone" -d /tmp/rclone-arm
            unzip -j rclone-amd.zip "*/rclone" -d /tmp/rclone-amd
            cp /tmp/rclone-arm/rclone src-tauri/bin/rclone-aarch64-apple-darwin
            cp /tmp/rclone-amd/rclone src-tauri/bin/rclone-x86_64-apple-darwin
            lipo -create -output src-tauri/bin/rclone-universal-apple-darwin \
              /tmp/rclone-arm/rclone \
              /tmp/rclone-amd/rclone
            chmod +x src-tauri/bin/rclone-aarch64-apple-darwin \
                     src-tauri/bin/rclone-x86_64-apple-darwin \
                     src-tauri/bin/rclone-universal-apple-darwin
          fi

      - name: Build release artifacts
        id: tauri-build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (free key, not code signing). Generated locally via
          # `tauri signer generate`; the private key lives only in GitHub secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Arx Runa ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Publish artifacts to public releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="salgaard/arx-runa-releases"

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Arx Runa $TAG" \
            --notes "See [changelog](https://github.com/salgaard/arx-runa) for details." \
            2>/dev/null || true

          echo '${{ steps.tauri-build.outputs.artifactPaths }}' \
            | jq -r '.[]' \
            | tr -d '\r' \
            | while read -r artifact; do
                path="${artifact//\\//}"
                [ -d "$path" ] && continue
                [ "$(basename "$path")" = "latest.json" ] && continue
                gh release upload "$TAG" "$path" --repo "$REPO" --clobber
              done

  publish-update-manifest:
    name: Publish update manifest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release download "$TAG" \
            --repo salgaard/arx-runa \
            --pattern "latest.json" \
            --output latest.json
          sed -i 's#/salgaard/arx-runa/releases/#/salgaard/arx-runa-releases/releases/#g' latest.json

      - name: Upload latest.json to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json \
            --repo salgaard/arx-runa-releases \
            --clobber
