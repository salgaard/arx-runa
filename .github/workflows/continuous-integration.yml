name: CI

on:
  push:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Prepend Strawberry Perl to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare CI rclone sidecar stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            touch src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            touch src-tauri/bin/rclone-aarch64-apple-darwin
            chmod +x src-tauri/bin/rclone-aarch64-apple-darwin
          fi

      - name: Run Clippy (warnings as errors)
        run: cargo clippy -p arx-runa-tauri --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p arx-runa-tauri --all-targets

      - name: Release build
        run: cargo build -p arx-runa-tauri --release

  e2e:
    name: e2e (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            xvfb \
            webkit2gtk-driver

      - name: Add msedgedriver to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Tauri uses the WebView2 runtime, not the Edge browser binary.
          # Detect the WebView2 version from the registry so we download an
          # msedgedriver that exactly matches the runtime version.
          $wv2Keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $wv2Version = $null
          foreach ($key in $wv2Keys) {
            $wv2Version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
            if ($wv2Version) { break }
          }
          if (-not $wv2Version) { Write-Error "Cannot detect WebView2 runtime version"; exit 1 }
          Write-Host "Detected WebView2 runtime version: $wv2Version"

          $zipUrl = "https://msedgedriver.azureedge.net/$wv2Version/edgedriver_win64.zip"
          $zipPath = "$env:RUNNER_TEMP\edgedriver_win64.zip"
          $extractPath = "$env:RUNNER_TEMP\edgedriver"
          Write-Host "Downloading msedgedriver from $zipUrl"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          echo "$extractPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Strawberry Perl for OpenSSL build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare CI rclone sidecar stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            touch src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe
          fi

      - name: Install Trunk (WASM bundler)
        run: cargo install trunk --locked

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install root npm dependencies (Tailwind CSS)
        run: npm install

      - name: Install e2e npm dependencies
        run: npm install
        working-directory: src-tauri/tests/e2e

      - name: Run e2e tests
        # npm test builds the app via `cargo tauri build --no-bundle` (onPrepare hook)
        # before launching tauri-driver. E2E_RELEASE=1 selects the release profile.
        # Linux needs a virtual framebuffer; macOS and Windows have a native display.
        shell: bash
        working-directory: src-tauri/tests/e2e
        env:
          E2E_RELEASE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm test
          else
            npm test
          fi
