name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # Fail the check if any new dependency has a known vulnerability.
          fail-on-severity: moderate
          # Deny packages with licenses incompatible with this project.
          # Update this list if a dependency requires a different license.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
