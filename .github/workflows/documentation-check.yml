name: Documentation Gap Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, development]

jobs:
  documentation-gap-check:
    name: Documentation Gap Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for documentation gaps
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only origin/master...HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -q '\[skip-docs\]'; then
            echo "Documentation check skipped: [skip-docs] in commit message."
            exit 0
          fi

          MODULES_CHANGED=""
          for module in crypto auth storage ui; do
            if echo "$CHANGED" | grep -q "^src-tauri/src/$module/"; then
              MODULES_CHANGED="$MODULES_CHANGED $module"
            fi
          done

          if [ -z "$MODULES_CHANGED" ]; then
            echo "No module-level source changes -- documentation check skipped."
            exit 0
          fi

          DOC_CHANGED=$(echo "$CHANGED" | grep -E "^docs/(architecture-decisions|report-log|architecture/diagrams)/" || true)

          if [ -n "$DOC_CHANGED" ]; then
            echo "Documentation updated alongside code changes:"
            echo "$DOC_CHANGED"
            exit 0
          fi

          echo ""
          echo "DOCUMENTATION GAP DETECTED"
          echo "=========================="
          echo ""
          echo "Source modules changed without documentation updates:"
          for module in $MODULES_CHANGED; do
            echo "  src-tauri/src/$module/"
          done
          echo ""
          echo "At least one of the following must be updated alongside module changes:"
          echo "  docs/architecture-decisions/    Architecture Decision Records"
          echo "  docs/report-log/                Bachelor report log entries"
          echo "  docs/architecture/diagrams/     Architecture diagrams"
          echo ""
          echo "To generate documentation: run '/document phase N' or '/report-note <topic>'"
          echo "The post-commit hook creates stubs automatically when configured."
          echo "To bypass for minor commits: include [skip-docs] in the commit message."
          exit 1

  docs-consistency-check:
    name: Docs Consistency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check broken relative markdown links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import shlex
          import sys
          import urllib.parse
          from pathlib import Path

          repository_root = Path(".").resolve()
          docs_root = Path("docs/architecture/designs")
          roadmap_path = Path("docs/roadmap.md")

          inline_link_pattern = re.compile(r'!?\[[^\]]+\]\(([^)]+)\)')
          reference_link_pattern = re.compile(r'^\s*\[[^\]]+\]:\s*(<[^>]+>|[^\s]+)')
          heading_pattern = re.compile(r'^(#{1,6})\s+(.*)$')

          markdown_files = sorted(
              path
              for path in docs_root.rglob("*.md")
              if "_templates" not in path.parts
          )
          markdown_files.append(roadmap_path)

          missing_scan_targets = [str(path) for path in markdown_files if not path.exists()]
          if missing_scan_targets:
              print("Docs consistency check configuration error: missing expected files:")
              for path in missing_scan_targets:
                  print(f" - {path}")
              sys.exit(1)

          def iter_non_fenced_lines(path: Path):
              in_fence = False
              lines = path.read_text(encoding="utf-8").splitlines()
              for line_number, line in enumerate(lines, start=1):
                  stripped = line.strip()
                  if stripped.startswith("```") or stripped.startswith("~~~"):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  yield line_number, line

          def normalize_link_target(raw_target: str) -> str:
              candidate = raw_target.strip()
              if candidate.startswith("<") and candidate.endswith(">"):
                  candidate = candidate[1:-1].strip()
              try:
                  parsed = shlex.split(candidate)
                  if parsed:
                      return parsed[0]
              except ValueError:
                  pass
              split_target = candidate.split()
              return split_target[0] if split_target else ""

          def slugify_heading(heading_text: str) -> str:
              without_inline_code = re.sub(r"`([^`]*)`", r"\1", heading_text.strip().lower())
              without_html = re.sub(r"<[^>]+>", "", without_inline_code)
              ascii_punctuation = "\"'!#$%&()*+,./:;<=>?@[\\]^`{|}~"
              canonical = without_html.translate(str.maketrans("", "", ascii_punctuation))
              canonical = re.sub(r"[\u2000-\u206F\u2E00-\u2E7F]", "", canonical)
              canonical = re.sub(r"\s", "-", canonical.strip())
              return canonical

          heading_cache: dict[Path, set[str]] = {}

          def markdown_anchors(path: Path) -> set[str]:
              resolved_path = path.resolve()
              if resolved_path in heading_cache:
                  return heading_cache[resolved_path]

              anchors: set[str] = set()
              seen: dict[str, int] = {}
              for _, line in iter_non_fenced_lines(resolved_path):
                  match = heading_pattern.match(line)
                  if match is None:
                      continue
                  heading_text = re.sub(r"\s+#+\s*$", "", match.group(2).strip())
                  slug = slugify_heading(heading_text)
                  if not slug:
                      continue
                  duplicate_index = seen.get(slug, 0)
                  anchor = slug if duplicate_index == 0 else f"{slug}-{duplicate_index}"
                  seen[slug] = duplicate_index + 1
                  anchors.add(anchor)

              heading_cache[resolved_path] = anchors
              return anchors

          link_errors: list[str] = []

          for source_file in markdown_files:
              source_resolved = source_file.resolve()
              for line_number, line in iter_non_fenced_lines(source_file):
                  candidate_targets = [match.group(1) for match in inline_link_pattern.finditer(line)]
                  reference_match = reference_link_pattern.match(line)
                  if reference_match is not None:
                      candidate_targets.append(reference_match.group(1))

                  for raw_target in candidate_targets:
                      normalized_target = normalize_link_target(raw_target)
                      if not normalized_target:
                          continue
                      if re.match(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", normalized_target):
                          continue
                      if normalized_target.startswith("//"):
                          continue
                      if normalized_target.startswith("/"):
                          continue

                      target_without_query = normalized_target.split("?", maxsplit=1)[0]
                      path_component, has_anchor, anchor_component = target_without_query.partition("#")
                      decoded_path = urllib.parse.unquote(path_component)
                      decoded_anchor = urllib.parse.unquote(anchor_component).strip().lower() if has_anchor else ""

                      if decoded_path:
                          resolved_target = (source_file.parent / decoded_path).resolve()
                          try:
                              resolved_target.relative_to(repository_root)
                          except ValueError:
                              link_errors.append(
                                  f"{source_file}:{line_number}: link '{normalized_target}' resolves outside repository root."
                              )
                              continue
                          if not resolved_target.exists():
                              link_errors.append(
                                  f"{source_file}:{line_number}: link target '{normalized_target}' does not exist."
                              )
                              continue
                      else:
                          resolved_target = source_resolved

                      if decoded_anchor:
                          if resolved_target.suffix.lower() != ".md":
                              link_errors.append(
                                  f"{source_file}:{line_number}: anchor link '{normalized_target}' must target a Markdown file."
                              )
                              continue
                          anchors = markdown_anchors(resolved_target)
                          if decoded_anchor not in anchors:
                              target_display = resolved_target.relative_to(repository_root)
                              link_errors.append(
                                  f"{source_file}:{line_number}: anchor '#{decoded_anchor}' not found in {target_display}."
                              )

          if link_errors:
              print("Broken relative Markdown links detected:")
              for error in link_errors:
                  print(f" - {error}")
              sys.exit(1)

          print("Relative Markdown link check passed.")
          PY

      - name: Check deprecated tokens in phase docs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t phase_design_files < <(find docs/architecture/designs -mindepth 2 -maxdepth 2 -type f -name 'design.md' | sort)
          phase_design_files+=(docs/roadmap.md)

          check_deprecated_token() {
            local token="$1"
            local matches

            matches="$(grep -nH -w -- "${token}" "${phase_design_files[@]}" || true)"
            if [ -n "$matches" ]; then
              echo "Deprecated token '${token}' detected in phase docs."
              echo "Replace it with the current terminology before merging."
              echo "$matches"
              return 1
            fi

            echo "Deprecated token '${token}' not found."
          }

          check_deprecated_token "share_path"
          check_deprecated_token "CloudEndpointConfig"

      - name: Verify contract markers in phase design docs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t phase_design_files < <(find docs/architecture/designs -mindepth 2 -maxdepth 2 -type f -name 'design.md' | sort)

          required_headings=(
            "## Contract Surface"
            "### Interface contract"
            "### Data contract"
            "### Invariant contract"
            "### Dependency contract"
          )

          missing_heading=0
          for design_file in "${phase_design_files[@]}"; do
            for heading in "${required_headings[@]}"; do
              if ! grep -Fqx "$heading" "$design_file"; then
                echo "${design_file} is missing required heading: ${heading}"
                missing_heading=1
              fi
            done
          done

          if [ "$missing_heading" -ne 0 ]; then
            echo "Contract marker check failed. Every docs/architecture/designs/*/design.md must include Contract Surface and all four required subheadings."
            exit 1
          fi

          echo "Contract marker check passed."
