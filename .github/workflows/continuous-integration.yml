name: CI

on:
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]
    #        platform: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Prepend Strawberry Perl to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare CI rclone sidecar stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            touch src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            touch src-tauri/bin/rclone-aarch64-apple-darwin
            chmod +x src-tauri/bin/rclone-aarch64-apple-darwin
          fi

      - name: Run Clippy (warnings as errors)
        run: cargo clippy -p arx-runa-tauri --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Release build
        run: cargo build -p arx-runa-tauri --release

  e2e:
    name: e2e (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]
    #        platform: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            xvfb \
            webkit2gtk-driver

      - name: Update WebView2 runtime to match runner's msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner ships msedgedriver pre-installed (matching its Edge version).
          # WebView2 runtime can lag one release behind, causing a version mismatch.
          # Updating WebView2 via the official bootstrapper brings it in sync.
          $bootstrapper = "$env:RUNNER_TEMP\WebView2RuntimeInstaller.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
          Start-Process -FilePath $bootstrapper -ArgumentList "/silent /install" -Wait
          Write-Host "WebView2 updated. Using pre-installed msedgedriver from PATH."

      - name: Configure Strawberry Perl for OpenSSL build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare CI rclone sidecar stub
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            touch src-tauri/bin/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/rclone-x86_64-unknown-linux-gnu
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            touch src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe
          fi

      - name: Install Trunk (WASM bundler)
        run: cargo install trunk --locked

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install root npm dependencies (Tailwind CSS)
        run: npm install

      - name: Install e2e npm dependencies
        run: npm install
        working-directory: src-tauri/tests/e2e

      - name: Run e2e tests
        # npm test builds the app via `cargo tauri build --no-bundle` (onPrepare hook)
        # before launching tauri-driver. E2E_RELEASE=1 selects the release profile.
        # Linux needs a virtual framebuffer; macOS and Windows have a native display.
        shell: bash
        working-directory: src-tauri/tests/e2e
        env:
          E2E_RELEASE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm test
          else
            npm test
          fi
