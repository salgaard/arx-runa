[workspace]
members = ["src-tauri"]
resolver = "3"

[package]
name = "arx-runa"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arx-runa"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
leptos_router = "0.8"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
serde-wasm-bindgen = "0.6"
gloo-timers = "0.3"
